name: tuturedu
description: "TuturEdu - chat platform for tuition centres."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  web: ^1.1.1
  file_picker: ^11.0.3
  firebase_storage: ^13.4.6
  url_launcher: ^6.3.2
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
